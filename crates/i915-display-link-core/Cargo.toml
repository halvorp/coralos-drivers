[package]
name = "i915-display-link-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "i915 Kaby Lake eDP link bring-up (SPT-LP, DDI-A): AUX/DPCD transactions, link training, DDI buffer translation, panel power sequencer and PCH PWM backlight, as planners"

[lib]
path = "src/lib.rs"

[dependencies]
i915-common-core = { path = "../i915-common-core" }
i915-devinfo-core = { path = "../i915-devinfo-core" }
i915-vbt-core = { path = "../i915-vbt-core" }
i915-kbl-display-core = { path = "../i915-kbl-display-core" }

[workspace]
