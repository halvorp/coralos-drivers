# SPDX-License-Identifier: GPL-2.0-only
# Ported from Linux drivers/gpu/drm/i915/{intel_uncore.c, intel_uncore.h, gt/intel_gt_regs.h} (v7.0-rc6): the Gen9 forcewake domains,
# the fw_ranges and shadowed-register tables, and the get / put / ack-wait protocol. Original copyright: Intel Corporation.
[package]
name = "i915-uncore-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "i915 uncore: Gen9 forcewake (GT/RENDER/MEDIA) get/put with bounded ack waits, fw_ranges lookup, over coralos-hal Mmio"

[lib]
path = "src/lib.rs"

[dependencies]
coralos-hal = { path = "../../hal" }
i915-common-core = { path = "../i915-common-core" }
i915-gt-regs-core = { path = "../i915-gt-regs-core" }
i915-devinfo-core = { path = "../i915-devinfo-core" }

[workspace]
