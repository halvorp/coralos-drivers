# Ported from Linux drivers/gpu/drm/i915/gt/{intel_lrc.c, intel_lrc.h, intel_lrc_reg.h, intel_execlists_submission.c, intel_ring.c,
# intel_ring.h, intel_ring_types.h, intel_timeline.c, intel_engine.h, intel_sseu.c} and i915_request.c (execlists, Gen9 / Kaby Lake only;
# v7.0-rc6). Original copyright: Intel Corporation.
[package]
name = "i915-submit-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "i915 execlists submission for Kaby Lake: logical ring context image, ELSP descriptors, CSB decode, ring buffers, requests, seqno retire and hang detection - pure state machines, no MMIO"

[lib]
path = "src/lib.rs"

[dependencies]
i915-common-core = { path = "../i915-common-core" }
i915-gt-regs-core = { path = "../i915-gt-regs-core" }
i915-devinfo-core = { path = "../i915-devinfo-core" }
i915-gt-core = { path = "../i915-gt-core" }
i915-gpu-commands-core = { path = "../i915-gpu-commands-core" }
i915-memory-core = { path = "../i915-memory-core" }

[workspace]
