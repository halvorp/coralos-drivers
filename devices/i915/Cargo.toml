# SPDX-License-Identifier: GPL-2.0-only
# i915.device — the Intel integrated GPU as a ring-3 CoralOS `.device` (public, GPL). STEP 2 of Astra's Kaby Lake GPU
# ruling: a skeleton that proves the public device boundary and READS the display state the firmware left, writing
# nothing. It links ONLY the display readout core (i915-kbl-display-core) plus coralos-rt (the runtime, MIT OR Apache-2.0)
# and coralos-hal; no CoralOS-proprietary crate (in particular none of coral-i915-gem or coral-drm-driver).
# The port is Kaby Lake's; Gen8 (Cherry Trail) rows migrate into this one device later, by runtime dispatch.
# INCREMENT 1 (2026-10-12): forcewake proof of life. The dependency list below is a CONTRACT (docs/I915-CONTRACTS.md): only coralos-rt,
# coralos-hal, i915-* port crates and the permissive i915-wire; tests/contract.rs fails the build on anything else.
[package]
name = "i915-device"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "i915.device: PCI identity, grant-bounded MMIO (writes: the three forcewake set registers only), Kaby Lake display readout, forcewake proof of life, explicit unsupported replies"

[lib]
name = "i915_device"
path = "src/lib.rs"

[features]
# Builds the standalone ELF (src/main.rs); off for the library and its host tests.
entry = []
# INCREMENT GATING (plan KBL-I915-PORT-PLAN section 3 / 5). Both OFF by default: the shipped build writes the three forcewake SET
# registers and nothing else. Each feature extends the executor's write allow-list (src/exec/allow.rs) and the BAR0 window grant
# with exactly the registers that increment's planners write, and with nothing else.
# P2: the GGTT window (BAR0 + 8 MiB) and the GGTT invalidate register.
p2-memory = []
# P3: execlists on the render engine, the per-engine RESET_CTL handshakes and GEN6_GDRST. Needs P2 (its objects are GGTT-bound).
p3-exec = ["p2-memory", "dep:i915-gem-core", "dep:i915-uapi-core", "dep:i915-syncobj-core"]

[[bin]]
name = "i915-device"
path = "src/main.rs"
test = false
required-features = ["entry"]

[dependencies]
coralos-rt = { path = "../../rt" }
coralos-hal = { path = "../../hal" }
i915-kbl-display-core = { path = "../../crates/i915-kbl-display-core" }
i915-common-core = { path = "../../crates/i915-common-core" }
i915-gt-regs-core = { path = "../../crates/i915-gt-regs-core" }
i915-devinfo-core = { path = "../../crates/i915-devinfo-core" }
i915-uncore-core = { path = "../../crates/i915-uncore-core" }
i915-wire = { path = "../../wire/i915-wire" }
i915-gt-core = { path = "../../crates/i915-gt-core" }
i915-memory-core = { path = "../../crates/i915-memory-core" }
i915-submit-core = { path = "../../crates/i915-submit-core" }
i915-display-clock-core = { path = "../../crates/i915-display-clock-core" }
i915-display-link-core = { path = "../../crates/i915-display-link-core" }
# D18 display ownership: the adoption predicate (initial plane config, GGTT extent, the one offered mode) and the surface-replacement plan
i915-display-modeset-core = { path = "../../crates/i915-display-modeset-core" }
# the uAPI service (src/uapi, feature p3-exec): GEM planning, uAPI validation, drm_syncobj semantics
i915-gem-core = { path = "../../crates/i915-gem-core", optional = true }
i915-uapi-core = { path = "../../crates/i915-uapi-core", optional = true }
i915-syncobj-core = { path = "../../crates/i915-syncobj-core", optional = true }

[dev-dependencies]
coralos-hal = { path = "../../hal", features = ["fake"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
